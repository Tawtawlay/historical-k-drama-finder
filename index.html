<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historical K-Drama Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <nav class="navbar bg-black py-3 sticky-top" data-bs-theme="dark">
        <div class="container-fluid">
            <div class="row w-100 align-items-center g-3">
              <div class="col-12 col-md-auto">
                <a class="navbar-brand brand-offset fs-3" href="#">K-Finder</a>
              </div>
              <div class="col-12 col-md">
                <div class="nav-actions d-flex flex-wrap align-items-center justify-content-end gap-3">
                  <form class="nav-search-form d-flex gap-2" role="search">
                    <div class="nav-search-field position-relative flex-grow-1">
                      <input class="form-control bg-dark-subtle border-0 text-white rounded-pill pe-5" id="titleSearch" type="search" name="q" placeholder="Search titles..." aria-label="Search titles">
                      <span class="nav-search-icon position-absolute top-50 end-0 translate-middle-y me-2 text-white" aria-hidden="true">
                        <i class="bi bi-search" aria-hidden="true"></i>
                      </span>
                    </div>
                  </form>
                  <div class="d-flex align-items-center gap-1">
                    <button class="btn btn-link text-white text-decoration-none text-nowrap account-button" type="button">LOG IN</button>
                    <button class="btn btn-primary rounded-4 text-nowrap account-button" type="button">SIGN IN</button>
                  </div>
                </div>
              </div>
            </div>
        </div>
    </nav>

    <div class="catalog-layout">
      <aside class="filters-sidebar" data-bs-theme="dark" aria-labelledby="filters-title">
        <div class="filter-heading">
          <h2 id="filters-title">Filters</h2>
          <p id="resultsCount" aria-live="polite">7 titles</p>
        </div>
        <div class="filter-controls">
          <fieldset class="filter-group">
            <legend>Streaming services</legend>
            <p class="filter-note">Sample availability</p>
            <div class="filter-options">
              <label class="filter-option"><input class="form-check-input" name="serviceFilter" type="checkbox" value="Netflix"><span>Netflix</span></label>
              <label class="filter-option"><input class="form-check-input" name="serviceFilter" type="checkbox" value="Hulu"><span>Hulu</span></label>
              <label class="filter-option"><input class="form-check-input" name="serviceFilter" type="checkbox" value="Disney+"><span>Disney+</span></label>
              <label class="filter-option"><input class="form-check-input" name="serviceFilter" type="checkbox" value="Viki"><span>Viki</span></label>
              <label class="filter-option"><input class="form-check-input" name="serviceFilter" type="checkbox" value="Kocowa"><span>Kocowa</span></label>
            </div>
          </fieldset>
          <fieldset class="filter-group">
            <legend>Era</legend>
            <div class="filter-options">
              <label class="filter-option"><input class="form-check-input" name="eraFilter" type="checkbox" value="three-kingdoms"><span>Three Kingdoms</span></label>
              <label class="filter-option"><input class="form-check-input" name="eraFilter" type="checkbox" value="goryeo"><span>Goryeo</span></label>
              <label class="filter-option"><input class="form-check-input" name="eraFilter" type="checkbox" value="joseon"><span>Joseon</span></label>
            </div>
          </fieldset>
          <fieldset class="filter-group">
            <legend>Type</legend>
            <div class="filter-options">
              <label class="filter-option"><input class="form-check-input" name="typeFilter" type="checkbox" value="movie"><span>Movies</span></label>
              <label class="filter-option"><input class="form-check-input" name="typeFilter" type="checkbox" value="show"><span>TV shows</span></label>
            </div>
          </fieldset>
          <fieldset class="filter-group">
            <legend>Genre</legend>
            <div class="filter-options">
              <label class="filter-option"><input class="form-check-input" name="genreFilter" type="checkbox" value="action"><span>Action</span></label>
              <label class="filter-option"><input class="form-check-input" name="genreFilter" type="checkbox" value="comedy"><span>Comedy</span></label>
              <label class="filter-option"><input class="form-check-input" name="genreFilter" type="checkbox" value="political"><span>Political</span></label>
              <label class="filter-option"><input class="form-check-input" name="genreFilter" type="checkbox" value="romance"><span>Romance</span></label>
              <label class="filter-option"><input class="form-check-input" name="genreFilter" type="checkbox" value="revenge"><span>Revenge</span></label>
            </div>
          </fieldset>
        </div>
      </aside>

      <main class="catalog-main">
      <section aria-labelledby="catalog-title">
        <div class="catalog-heading d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3">
          <div>
            <p class="section-kicker mb-2">THE K-FINDER COLLECTION</p>
            <h1 class="catalog-title mb-0" id="catalog-title">Stories from Korea's royal past</h1>
          </div>
        </div>

        <div class="movie-grid mx-auto">
          <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-2 justify-content-center align-items-start" id="titleGrid" aria-live="polite"></div>
        </div>
      </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
